<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applications - HakGame</title>
    <link rel="icon" type="image/png" href="../hakgame.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0c0814;
            color: #ffffff;
            overflow-x: hidden;
            scroll-behavior: smooth;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .neon-bg-effects {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            pointer-events: none;
            background: 
                radial-gradient(circle at 15% 25%, rgba(186, 104, 200, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 85% 75%, rgba(147, 112, 219, 0.1) 0%, transparent 40%);
        }
        header {
            position: sticky;
            top: 0;
            padding: 20px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(12, 8, 20, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-direction: row-reverse;
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
        }
        .studio-logo {
            width: 45px;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(186, 104, 200, 0.4);
        }
        .studio-name {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(to right, #ba68c8, #9370db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        nav {
            display: flex;
            align-items: center;
            gap: 30px;
        }
        nav ul { display: flex; list-style: none; gap: 35px; margin: 0; padding: 0; }
        nav a {
            color: #a0a0a0;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: 0.3s;
        }
        nav a:hover, nav a.active {
            color: #ba68c8;
            text-shadow: 0 0 8px rgba(186, 104, 200, 0.6);
        }
        main {
            flex: 1;
        }
        .content-section {
            padding: 80px 6%;
            text-align: center;
        }
        .section-title {
            font-size: 36px;
            text-align: center;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #fff 60%, #ba68c8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .section-subtitle {
            font-size: 16px;
            color: #a0a0a0;
            margin-bottom: 60px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .showcase-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 35px;
            transition: 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            text-decoration: none;
            color: inherit;
        }
        .showcase-card:hover {
            transform: translateY(-5px);
            border-color: #ba68c8;
            box-shadow: 0 10px 30px rgba(186, 104, 200, 0.15);
        }
        .card-icon-wrapper {
            width: 90px;
            height: 90px;
            border-radius: 16px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(186, 104, 200, 0.05);
            border: 1px solid rgba(186, 104, 200, 0.2);
            box-shadow: 0 0 20px rgba(186, 104, 200, 0.15);
        }
        .card-icon-wrapper i {
            font-size: 40px;
            color: #ba68c8;
            text-shadow: 0 0 10px rgba(186, 104, 200, 0.4);
        }
        .card-title {
            font-size: 24px;
            margin: 0 0 12px 0;
            color: #ffffff;
        }
        .card-description {
            font-size: 15px;
            color: #a0a0a0;
            line-height: 1.6;
            margin-bottom: 30px;
            flex-grow: 1;
        }
        .section-action-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            color: #ba68c8;
            border: 2px solid #ba68c8;
            padding: 12px 30px;
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
            width: 100%;
            max-width: 220px;
            box-sizing: border-box;
            justify-content: center;
        }
        .section-action-button i {
            transition: transform 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .showcase-card:hover .section-action-button {
            background: #ba68c8;
            color: #000;
            box-shadow: 0 0 20px rgba(186, 104, 200, 0.4);
        }
        .showcase-card:hover .section-action-button i {
            transform: translateY(3px);
        }
        footer {
            padding: 40px 6% 30px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            margin-top: auto;
        }
        .copyright-text {
            color: #666;
            font-size: 14px;
            letter-spacing: 1px;
        }
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
                padding: 15px 4%;
            }
            nav ul { gap: 20px; }
            nav a { font-size: 14px; }
            .content-section { padding: 40px 4%; }
            .section-title { font-size: 28px; }
        }
    </style>
</head>
<body>

    <div class="neon-bg-effects"></div>

    <header>
        <a href="../index.html" class="logo-container">
            <img src="../hakgame.png" alt="Hakgame Logo" class="studio-logo">
            <span class="studio-name">HAKGAME</span>
        </a>
        <nav>
            <ul>
                <li><a href="../index.html#home">Home</a></li>
                <li><a href="../index.html#games">Games</a></li>
                <li><a href="index.html" class="active">Apps</a></li>
                <li><a href="../index.html#profiles">My Profiles</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="content-section">
            <h1 class="section-title">Applications</h1>
            <p class="section-subtitle">Explore tools and software built for performance and efficiency.</p>
            
            <div class="grid-container">
                <a href="../zYigitt_Macro.exe" download class="showcase-card">
                    <div class="card-icon-wrapper">
                        <i class="fas fa-mouse-pointer"></i>
                    </div>
                    <h2 class="card-title">zYigitt Macro</h2>
                    <p class="card-description">Macro.</p>

                    <div class="section-action-button">
                        Download <i class="fas fa-download"></i>
                    </div>
                </a>
            </div>
        </section>
    </main>

    <footer>
        <p class="copyright-text">© 2026 HakGame All Rights Reserved.</p>
    </footer>

</body>
</html>

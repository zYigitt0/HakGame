<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applications - HakGame</title>
    <link rel="icon" type="image/png" href="../hakgame.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0c0814;
            color: #ffffff;
            overflow-x: hidden;
            scroll-behavior: smooth;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .neon-bg-effects {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            pointer-events: none;
            background: 
                radial-gradient(circle at 15% 25%, rgba(186, 104, 200, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 85% 75%, rgba(147, 112, 219, 0.1) 0%, transparent 40%);
        }
        header {
            position: sticky;
            top: 0;
            padding: 20px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(12, 8, 20, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-direction: row-reverse;
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
        }
        .studio-logo {
            width: 45px;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(186, 104, 200, 0.4);
        }
        .studio-name {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(to right, #ba68c8, #9370db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        nav {
            display: flex;
            align-items: center;
            gap: 30px;
        }
        nav ul { display: flex; list-style: none; gap: 35px; margin: 0; padding: 0; }
        nav a {
            color: #a0a0a0;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: 0.3s;
        }
        nav a:hover, nav a.active {
            color: #ba68c8;
            text-shadow: 0 0 8px rgba(186, 104, 200, 0.6);
        }
        main {
            flex: 1;
        }
        .content-section {
            padding: 100px 6%;
            text-align: center;
        }
        .section-title {
            font-size: 36px;
            text-align: center;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #fff 60%, #ba68c8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .coming-soon-text {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: 4px;
            margin: 60px 0;
            background: linear-gradient(45deg, #ba68c8, #9370db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(186, 104, 200, 0.3);
            animation: pulse 2s infinite alternate;
        }
        @keyframes pulse {
            from { transform: scale(0.98); opacity: 0.8; }
            to { transform: scale(1.02); opacity: 1; }
        }
        footer {
            padding: 40px 6% 30px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            margin-top: auto;
        }
        .copyright-text {
            color: #666;
            font-size: 14px;
            letter-spacing: 1px;
        }
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
                padding: 15px 4%;
            }
            nav ul { gap: 20px; }
            nav a { font-size: 14px; }
            .content-section { padding: 60px 4%; }
            .section-title { font-size: 28px; }
            .coming-soon-text { font-size: 32px; }
        }
    </style>
</head>
<body>

    <div class="neon-bg-effects"></div>

    <header>
        <a href="../index.html" class="logo-container">
            <img src="../hakgame.png" alt="Hakgame Logo" class="studio-logo">
            <span class="studio-name">HAKGAME</span>
        </a>
        <nav>
            <ul>
                <li><a href="../index.html#home">Home</a></li>
                <li><a href="../index.html#games">Games</a></li>
                <li><a href="index.html" class="active">Apps</a></li>
                <li><a href="../index.html#profiles">My Profiles</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="content-section">
            <h1 class="section-title">Applications</h1>
            <div class="coming-soon-text">COMING SOON</div>
        </section>
    </main>

    <footer>
        <p class="copyright-text">© 2026 HakGame All Rights Reserved.</p>
    </footer>

</body>
</html>
